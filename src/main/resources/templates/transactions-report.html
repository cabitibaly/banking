<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Rapport des Transactions</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            font-size: 180px;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 120px;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
        }

        .period {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        table {
            width: 98%;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid #000;
            padding: 120px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .footer {
            margin-top: 100px;
            text-align: right;
            font-size: 100px;
        }
    </style>
</head>

<body>

<div class="header">
    <h2>BANQUE - RAPPORT DES TRANSACTIONS</h2>
</div>

<div class="period">
    Période :
    <span th:text="${start}"></span>
    →
    <span th:text="${end}"></span>
</div>

<table>
    <thead>
    <tr>
        <th>Référence</th>
        <th>Type</th>
        <th>Montant</th>
        <th>Devise</th>
        <th>Statut</th>
        <th>Date</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="t : ${transactions}">
        <td th:text="${t.transactionRef}"></td>
        <td th:text="${t.type}"></td>
        <td th:text="${t.amount}"></td>
        <td th:text="${t.currency}"></td>
        <td th:text="${t.status}"></td>
        <td th:text="${t.createdAt}"></td>
    </tr>
    </tbody>
</table>

<div class="footer">
    Généré automatiquement par le système bancaire
</div>

</body>
</html>
