services:
  db:
    container_name: banking-db
    image: postgres:16-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bank
    ports:
      - 5432:5432
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - banking-network

  adminer:
    container_name: banking-adminer
    image: adminer
    restart: unless-stopped
    ports:
      - 7080:8080
    networks:
      - banking-network

  redis:
    container_name: banking-redis
    image: redis:8.4.0-alpine
    restart: unless-stopped
    ports:
      - 6379:6379
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
        - redis-banking:/data
    networks:
      - banking-network

  smtp4dev:
    image: rnwood/smtp4dev:v3
    restart: always
    ports:
      - 9081:80
      - 9025:25
    networks:
      - banking-network

volumes:
  db-data:
  redis-banking:

networks:
  banking-network:
    driver: bridge